<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lighted Tutoriales</title>
<link rel="icon" href="images/icono.png">

<style>
:root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #15171a;
    --muted: #667085;
    --border: #e4e7ec;
    --accent: #1d4ed8;
    --yellow: #facc15;
    --yellow-dark: #eab308;
    --on-yellow: #1a1a1a;
    --thumb: #0b1736;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0a1020;
        --card: #121b30;
        --text: #f2f4f7;
        --muted: #98a2b3;
        --border: #26324d;
        --accent: #60a5fa;
    }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px;
}

/* Encabezado */
header {
    border-top: 5px solid var(--accent);
    padding: 48px 0 32px;
    text-align: center;
}

header img {
    height: 56px;
    width: auto;
    max-width: 260px;
    margin: 0 auto 16px;
    object-fit: contain;
}

header p {
    color: var(--muted);
    font-size: 16px;
}

/* Lista de enlaces */
h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    padding-left: 10px;
    border-left: 4px solid var(--accent);
}

.links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 64px;
}

.link-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: border-color .15s, box-shadow .15s;
}

.link-card:hover {
    border-color: var(--accent);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
}

.link-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.link-thumb {
    flex: none;
    width: 168px;
    aspect-ratio: 16 / 9;
    display: grid;
    place-items: center;
    background: var(--thumb);
    border-radius: 10px;
    overflow: hidden;
}

.link-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.link-body { min-width: 0; }

.link-body h3 {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
}

.link-body .author {
    color: var(--muted);
    font-size: 14px;
    margin-top: 2px;
}

.link-body .desc {
    font-size: 14px;
    margin-top: 8px;
}

/* Contraseña */
.password-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 18px;
    margin-bottom: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--yellow);
    border-radius: 14px;
}

.password-box .label {
    color: var(--muted);
    font-size: 13px;
}

.password-box .code {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .06em;
    word-break: break-all;
}

.copy-btn {
    flex: none;
    padding: 10px 18px;
    background: var(--yellow);
    color: var(--on-yellow);
    border: 0;
    border-radius: 10px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
}

.copy-btn:hover { background: var(--yellow-dark); }
.copy-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

@media (max-width: 560px) {
    .password-box { flex-direction: column; align-items: stretch; text-align: center; }
}

footer {
    border-top: 1px solid var(--border);
    padding: 24px 0 40px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

@media (max-width: 560px) {
    header { padding: 32px 0 24px; }
    .link-card { flex-direction: column; align-items: stretch; gap: 12px; }
    .link-thumb { width: 100%; }
}
</style>
</head>

<body>

<header>
    <div class="container">
        <img src="images/logocompleto.png" alt="Lighted Tutoriales">
        <p>Tutoriales y recursos para la comunidad.</p>
    </div>
</header>

<main class="container">

    <div class="password-box">
        <div>
            <p class="label">Contraseña de todos los enlaces</p>
            <p class="code" id="passwordText">LIGHTEDTUTORIALES</p>
        </div>
        <button class="copy-btn" id="copyBtn" type="button">Copiar</button>
    </div>

    <h2>Tutoriales</h2>

    <div class="links">

        <!-- ENLACE 1 -->
        <a href="https://stly.link/Lighted" class="link-card" target="_blank" rel="noopener">
            <div class="link-thumb">
                <img src="images/die.jpg" alt="Dur0 d3 m4ta4r">
            </div>
            <div class="link-body">
                <h3>Dur0 d3 m4ta4r</h3>
                <p class="author">Lighted Tutoriales</p>
                <p class="desc">Accede al contenido y recursos de este tutorial.</p>
            </div>
        </a>

        <!--
            PARA AGREGAR MÁS ENLACES:
            Copia el bloque completo de arriba (de <a ...> a </a>),
            pégalo aquí debajo y cambia el href, el título y la descripción.
        -->

    </div>

</main>

<footer>
    <div class="container">© Lighted Tutoriales</div>
</footer>

<script>
document.getElementById("copyBtn").addEventListener("click", function () {
    var btn = this;
    var text = document.getElementById("passwordText").textContent.trim();

    function done() {
        btn.textContent = "¡Copiada!";
        setTimeout(function () { btn.textContent = "Copiar"; }, 2000);
    }

    function fallback() {
        var t = document.createElement("textarea");
        t.value = text;
        t.style.position = "fixed";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.select();
        try { document.execCommand("copy"); done(); } catch (e) {}
        document.body.removeChild(t);
    }

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, fallback);
    } else {
        fallback();
    }
});
</script>

</body>
</html>
